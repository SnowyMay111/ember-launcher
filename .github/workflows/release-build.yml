# Every push to main builds Ember.app and keeps the zip as a workflow artifact (no GitHub releases are created).
# Stable releases stay manual, so the in-app updater keeps following them.
name: Release build

on:
  push:
    branches: [main]

permissions:
  contents: read

# One build per commit: queue instead of cancelling.
concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Optional: with the EMBER_SIGN_P12 (base64 .p12) and EMBER_SIGN_P12_PASSWORD secrets the build is signed
      # with the "Ember Signing" certificate; without them it stays ad-hoc signed.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.EMBER_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.EMBER_SIGN_P12_PASSWORD }}
        run: |
          if [ -n "$P12" ]; then
            echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
            security create-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
            security unlock-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
            security import "$RUNNER_TEMP/sign.p12" -k "$RUNNER_TEMP/ci.keychain-db" -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/ci.keychain-db" >/dev/null
            security list-keychains -d user -s "$RUNNER_TEMP/ci.keychain-db" login.keychain-db
          fi

      - name: Build and zip
        run: scripts/package-app.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Ember-mac-arm64-${{ github.sha }}
          path: dist/Ember-mac-arm64.zip
          retention-days: 30
