<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Ember</title>
  <desc id="d">Ember, a native Minecraft launcher for Apple Silicon Macs with an AI modpack generator</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a0b"/>
      <stop offset="1" stop-color="#181110"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#ff8a4c" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#8a3d5c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0b0a0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="0.5" cy="1" r="0.8">
      <stop offset="0" stop-color="#ff7a3c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff7a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc99a"/>
      <stop offset="1" stop-color="#ee8a56"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6ee"/>
      <stop offset="1" stop-color="#ffc79b"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa36a"/>
      <stop offset="1" stop-color="#c8507a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="640" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="640" fill="url(#bg)"/>
    <rect width="1280" height="640" fill="url(#grid)"/>
    <rect width="1280" height="640" fill="url(#glow)"/>

    <!-- the Play-screen scene: a low sun over dark hills -->
    <circle cx="990" cy="250" r="104" fill="url(#sun)"/>
    <polygon points="700,640 930,360 1050,450 1170,372 1280,520 1280,640" fill="#140e0f"/>
    <polygon points="820,640 1060,440 1180,520 1250,470 1280,500 1280,640" fill="#0e0a0b"/>
    <rect x="0" y="420" width="1280" height="220" fill="url(#haze)"/>

    <!-- embers -->
    <g fill="#ffb27a">
      <circle cx="702" cy="150" r="2.4" opacity="0.8"/>
      <circle cx="744" cy="214" r="1.6" opacity="0.55"/>
      <circle cx="1112" cy="86" r="2" opacity="0.7"/>
      <circle cx="1196" cy="168" r="1.5" opacity="0.5"/>
      <circle cx="846" cy="62" r="1.4" opacity="0.5"/>
      <circle cx="1058" cy="560" r="2.4" opacity="0.65"/>
      <circle cx="640" cy="520" r="1.4" opacity="0.4"/>
      <circle cx="1236" cy="46" r="1.8" opacity="0.6"/>
    </g>
  </g>
  <!-- gem -->
  <g transform="translate(96 132)">
    <rect width="88" height="88" rx="24" fill="#17120f" stroke="#ffffff" stroke-opacity="0.12"/>
    <polygon points="44,19 69,44 44,69 19,44" fill="url(#gem)"/>
    <polygon points="44,19 69,44 44,44" fill="#ffffff" fill-opacity="0.22"/>
  </g>

  <!-- wordmark -->
  <text x="90" y="392" font-family="Manrope, -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="190" font-weight="800" letter-spacing="-7" fill="url(#word)">Ember</text>
  <text x="96" y="458" font-family="Manrope, -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="500" fill="#e9dccf">A native Minecraft launcher for Apple Silicon.</text>
  <text x="96" y="514" font-family="'DM Mono', 'SF Mono', Menlo, monospace" font-size="21" letter-spacing="2" fill="#a8998c">FABRIC · FORGE · NEOFORGE · MODRINTH · AI MODPACKS</text>
</svg>
